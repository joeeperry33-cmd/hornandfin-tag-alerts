name = "leftover-tag-alerts"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Serve the site on leftovertagalerts.com and www (www redirects to the main domain in code).
# Cloudflare creates the DNS records and certificates on deploy.
routes = [
  { pattern = "leftovertagalerts.com", custom_domain = true },
  { pattern = "www.leftovertagalerts.com", custom_domain = true },
]
# Keep the leftover-tag-alerts.<subdomain>.workers.dev test address working too.
workers_dev = true

# Every 15 minutes: check state pages and send instant alerts to paid subscribers.
# 14:30 UTC (7:30am Pacific in summer): send the free daily digest.
[triggers]
crons = ["*/15 * * * *", "30 14 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "leftover-tag-alerts"
database_id = "0dc4b709-d7d3-47b4-801a-1f9f81d8bc4f"

[vars]
SITE_NAME = "Leftover Tag Alerts"
SITE_URL = "https://leftovertagalerts.com"
API_URL = "https://leftovertagalerts.com"
# Other sites allowed to embed the sign-up form (widget.js). Comma list of hostnames.
EMBED_ORIGINS = "hornandfin.com,landownertagauctions.com"
FROM_EMAIL = "Leftover Tag Alerts <alerts@leftovertagalerts.com>"
CONTACT_EMAIL = "support@leftovertagalerts.com"
BUSINESS_NAME = "Perry Capital LLC"
BUSINESS_ADDRESS = "158 Valley View Dr, Auburn, CA 95603"
PAID_PRICE_LABEL = "$4.99/month"
USER_AGENT = "LeftoverTagAlerts/0.2 (+https://leftovertagalerts.com/bot)"

# Secrets (set with `wrangler secret put NAME` or in the dashboard, never commit them):
#   RESEND_API_KEY        email sending (resend.com)
#   TWILIO_ACCOUNT_SID    text messages
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER    e.g. +15305550123
#   STRIPE_SECRET_KEY     paid tier
#   STRIPE_PRICE_ID       the monthly price for instant alerts
#   STRIPE_WEBHOOK_SECRET
#   ADMIN_TOKEN           protects /admin endpoints

# Keep worker logs in the dashboard (Workers & Pages > leftover-tag-alerts > Logs)
[observability]
enabled = true
